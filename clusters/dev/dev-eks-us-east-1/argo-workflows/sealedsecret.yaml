# gitops-flux/clusters/dev/dev-eks-us-east-1/argo-workflows/sealedsecret.yaml
#
# WHY THIS EXISTS AT ALL: this repository is PUBLIC, and all three values
# below embed the AWS account id - two IRSA role ARNs and a bucket name whose
# suffix is the account id. Same reason external-dns, cert-manager and
# aws-load-balancer-controller carry one.
#
# It holds a whole `values.yaml`, merged into the HelmRelease through
# `valuesFrom` in patch.yaml:
#
#   workflow.serviceAccount.annotations    IRSA role, read/write on the bucket
#   server.serviceAccount.annotations      IRSA role, read-only
#   artifactRepository.s3.bucket           the artifact bucket
#
# Namespace is flux-system, NOT argo-workflows: `valuesFrom` resolves in the
# HelmRelease's own namespace, and this HelmRelease lives in flux-system.
# Putting it in argo-workflows gives a ValuesError that names a namespace
# nobody expected - the trap that froze monitoring for two days (#97).
#
# ⚠️ RESEALING: a SealedSecret is encrypted to ONE controller's key pair.
# This ciphertext is useless on any other cluster and cannot be copied to one
# - regenerate it there with that cluster's certificate. Recreate with:
#
#   kubectl create secret generic argo-workflows-irsa -n flux-system \
#     --dry-run=client --from-file=values.yaml=<file> -o yaml \
#   | kubeseal --format yaml \
#       --controller-name sealed-secrets-sealed-secrets \
#       --controller-namespace sealed-secrets
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argo-workflows-irsa
  namespace: flux-system
spec:
  encryptedData:
    values.yaml: 
  template:
    metadata:
      name: argo-workflows-irsa
      namespace: flux-system
