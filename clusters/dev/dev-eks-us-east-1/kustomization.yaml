apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/2.4.0
  - infrastructures.yaml
  - gateway-api-crds.yaml
  - gateway-api.yaml
  - aws-load-balancer-controller.yaml
  - cert-manager.yaml
  - cert-manager-issuers.yaml
  - external-dns.yaml
  - keda.yaml
  - velero.yaml
  - karpenter.yaml
  - karpenter-nodepool.yaml
  - argo-bootstrap.yaml
patches:
  - path: patch.yaml
  # Flux controllers stay on the on-demand system nodes.
  - target:
      kind: Deployment
      namespace: flux-system
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            nodeSelector:
              workload: system
