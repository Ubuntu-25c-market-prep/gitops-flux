# Monitoring: Prometheus, Alertmanager, Grafana. Spot first, on-demand fallback.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: dev-np-monitoring-spot-od-us-east-1
spec:
  template:
    metadata:
      labels:
        workload: monitoring
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: dev-nc-default-us-east-1
      taints:
        - key: dedicated
          value: monitoring
          effect: NoSchedule
      expireAfter: 720h
      terminationGracePeriod: 30m # a stuck drain ends after this
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [t3a.medium, t3.medium, t3a.large, t3.large, m5.large, m6i.large]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-east-1a"] # the volumes' zone: one node, not one per zone
  disruption:
    consolidationPolicy: WhenEmpty # holds volumes: never moved to save money
    consolidateAfter: 30m
    budgets:
      - nodes: "1"
  limits:
    cpu: "4"
    memory: 16Gi
