# gitops-flux/clusters/dev/dev-eks-us-east-1/aws-load-balancer-controller/sealedsecret.yaml
#
# Decrypts (in-cluster only, by the sealed-secrets controller this cluster
# runs) into a Secret named aws-load-balancer-controller-irsa in flux-system,
# holding one key - values.yaml - a Helm values fragment that sets the
# aws-load-balancer-controller ServiceAccount's IRSA role-arn annotation.
# infrastructures/base/aws-load-balancer-controller/helmrelease.yaml reads it
# via valuesFrom (kind: Secret).
#
# encryptedData can only be decrypted by THIS cluster's sealed-secrets
# controller - the private key never leaves it. Safe to commit to a public
# repo even though the plaintext embeds the AWS account id.
#
# To regenerate (e.g. the role ARN changes, or terraform-infra-v2 recreates
# the role):
#
#   kubeseal --fetch-cert --context dev-eks-us-east-1 \
#     --controller-namespace=sealed-secrets \
#     --controller-name=sealed-secrets-sealed-secrets \
#     > pub-cert.pem
#
#   cat <<EOF | kubeseal --format=yaml --cert=pub-cert.pem > sealedsecret.yaml
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: aws-load-balancer-controller-irsa
#     namespace: flux-system
#   stringData:
#     values.yaml: |
#       serviceAccount:
#         annotations:
#           eks.amazonaws.com/role-arn: <ARN, from terraform-infra-v2 eks stack's irsa_role_arns output>
#   EOF
#
# --fetch-cert only ever returns a PUBLIC key - read-only, safe, and the one
# unavoidable live step any SealedSecret needs (asymmetric encryption). Every
# other step, including this one, runs offline against the fetched cert -
# no live cluster access to create or update the value itself.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: aws-load-balancer-controller-irsa
  namespace: flux-system
spec:
  encryptedData:
    values.yaml: 
  template:
    metadata:
      name: aws-load-balancer-controller-irsa
      namespace: flux-system
