# Sealed with the dev-eks-us-east-1 controller's public cert (docs/velero/README.md, step 2).
# Decrypts to Secret flux-system/velero-irsa: the IRSA role ARN and backup bucket.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: velero-irsa
  namespace: flux-system
spec:
  encryptedData:
    values.yaml: 
  template:
    metadata:
      name: velero-irsa
      namespace: flux-system
