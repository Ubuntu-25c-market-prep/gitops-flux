# Karpenter controller for dev-eks-us-east-1. NodePools are a separate Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 5m0s
  path: ./clusters/dev/dev-eks-us-east-1/karpenter
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  # Sealed Secrets must be running to decrypt sealedsecret.yaml.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sealed-secrets
      namespace: flux-system
  timeout: 5m0s
