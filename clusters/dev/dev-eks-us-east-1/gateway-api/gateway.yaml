# Kubernetes Gateway API, NOT networking.istio.io - this cluster
# deliberately diverges from 25c-shared, which uses Istio's classic
# Gateway/VirtualService API plus the istio/gateway Helm chart. Nothing
# from infrastructures/base/istio-gateway is referenced here: with Gateway
# API, istiod's own deployment controller provisions the Envoy data plane
# directly from this object, so there is no chart to install.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # gateway-conventions.md §3's naming example is "ingressgateway" (what
  # 25c-shared's classic networking.istio.io Gateway is named) - not used
  # here on purpose. This object's `kind` is already `Gateway`; stacking
  # "gateway" into the name too just repeats the type, and "ingress" reads
  # as the Kubernetes `Ingress` API, which this explicitly is not. One
  # shared listener per cluster, @istio owns the name either way.
  name: gateway
  namespace: platform-istio
  labels:
    # REVISION PINNING. This install has no default (unrevisioned) istiod -
    # istio-base's defaultRevision is 1-30-3
    # (infrastructures/dev/dev-eks-us-east-1/istio-base/patch.yaml). Istio's
    # gateway deployment controller applies the same revision-matching
    # rules to Gateway objects that it applies to sidecar injection: an
    # object with no istio.io/rev label, in a namespace with no istio.io/rev
    # label, resolves to the "default" revision - which does not exist
    # here. The failure mode is the quiet one: the Gateway is accepted, no
    # Deployment is ever created, and PROGRAMMED stays False with no
    # obvious cause.
    istio.io/rev: 1-30-3
  annotations:
    # Istio-specific, not part of the Gateway API spec: controls the KIND
    # of Service the deployment controller generates. Default is
    # LoadBalancer, which is what we want - documented here as the lever to
    # flip to ClusterIP if a public/internal NLB is ever judged unnecessary
    # for an ingress with no routes yet.
    networking.istio.io/service-type: LoadBalancer
spec:
  # Created automatically by istiod at startup once the Gateway API CRDs
  # exist - not something this repo installs (see gatewayclass output:
  # `kubectl get gatewayclass istio`).
  gatewayClassName: istio

  # spec.infrastructure.annotations is the Gateway API v1.x standard way to
  # get annotations onto the generated Service (and Deployment). It
  # replaces the older Istio behavior of copying the Gateway's own
  # metadata.annotations, which still works but isn't part of the portable
  # API surface.
  infrastructure:
    annotations:
      # AWS Load Balancer Controller (clusters/dev/dev-eks-us-east-1/
      # aws-load-balancer-controller/), not the legacy in-tree cloud
      # provider this Gateway launched with. "external" is what hands the
      # Service to the controller instead of the in-tree provider -
      # "nlb" alone (the in-tree value) is not recognised by the controller
      # and would leave the Service unclaimed. nlb-target-type "ip"
      # registers pod IPs directly into the target group, instead of the
      # in-tree provider's NodePort+kube-proxy hop through EC2 instance
      # targets - fewer network hops, health checks that measure the actual
      # Envoy pod instead of the node, and no need for
      # externalTrafficPolicy: Local to preserve the client source IP.
      #
      # MIGRATION NOTE: the Service already has an in-tree-provisioned NLB
      # from when this Gateway launched. This annotation change makes the
      # controller provision a NEW NLB with a NEW address - it does not
      # relabel the existing one. Low blast radius right now specifically
      # because no DNS record points at the old address yet (see the public
      # NLB comment below) and there are zero HTTPRoutes serving real
      # traffic. Confirm the new NLB is healthy
      # (`aws elbv2 describe-target-health` on its target group - targets
      # should be pod IPs, not instance ids), THEN delete the orphaned old
      # NLB by hand; it will not clean itself up.
      # "external" alone doesn't say NLB anywhere - that's implicit, not a
      # choice made here. The controller provisions an NLB for every Service
      # of type LoadBalancer it manages; it only ever creates an ALB from an
      # Ingress or a Gateway API HTTPRoute (L7 resources with host/path
      # rules to route on). A Service carries no such rules, so ALB isn't an
      # option the controller offers for one - confirmed by
      # nlb-target-type below having no alb- equivalent in the chart's
      # annotation set. What actually makes this a Service in the first
      # place is networking.istio.io/service-type: LoadBalancer above,
      # which tells istiod to generate a Service (not some other object) -
      # NLB follows from that, not from anything stated in this block.
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      # Explicit, not relying on the chart default. Verified via
      # `helm show values aws-load-balancer-controller --version 3.5.0`:
      # defaultLoadBalancerScheme is "internal" - without this line the new
      # controller-owned NLB would silently come up internal-only, quietly
      # reversing the public decision already made below and in #198.
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      # PUBLIC on purpose, decided before any DNS record exists: an AWS
      # NLB's internal/public-ness isn't a flag you flip on a live
      # balancer, it's a different balancer with a different address, so
      # this is the cheap moment to choose - before external-dns ever
      # publishes this address anywhere. Matches where this is headed:
      # Grafana, Rancher, Kiali and friends need real user access, same as
      # 25c-shared's already-public gateway.
      #
      # Was safe with only a plain HTTP/80 listener specifically because
      # there were zero HTTPRoutes - nothing to intercept. That HTTPS
      # listener now exists (below, cert-manager#203/#204 proved DNS-01 +
      # IRSA end to end on the real prod certificate) - so the same rule
      # now applies for real: DO NOT route anything through this Gateway's
      # http listener alone. Any HTTPRoute a namespace attaches should
      # target both listeners (or redirect http -> https), never http only.
      # Enforce that as a review rule on every HTTPRoute PR.
    labels:
      u25c.io/workstream: istio

  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # No `hostname:` - this listener accepts any Host header, and the
      # HTTPRoutes that attach decide what actually routes. With no routes
      # attached yet, Envoy's default 404 is the correct, verifiable state
      # (same reasoning 25c-shared's route-less classic Gateway uses).
      allowedRoutes:
        namespaces:
          # NOT the default (`Same`, which would confine every HTTPRoute to
          # platform-istio). NOT `All` either: per
          # ops-program/docs/gateway-conventions.md §2, this Gateway is
          # owned by @istio and app teams own the HTTPRoutes in their own
          # namespaces - the Gateway owner decides who may attach, which is
          # exactly what `Selector` expresses. Widening to `All` later is a
          # one-line change here that rewrites no HTTPRoute.
          from: Selector
          selector:
            matchLabels:
              u25c.io/istio-gateway-access: "true"

    # APPENDED, not a replacement - the http listener above stays exactly as
    # it was. Istio adds :443 to the EXISTING gateway-istio Service, so the
    # NLB's address is unchanged and nothing that already resolved it (there
    # is no DNS record yet, but the principle holds for later) has to
    # change. This is the additive step planned all the way back when the
    # NLB was first made public (#198) and when the AWS Load Balancer
    # Controller took it over (#202): only cert-manager was still missing.
    - name: https
      port: 443
      protocol: HTTPS
      # Single-label hostnames only, per ops-program/docs/gateway-conventions.md
      # §3: the wildcard cert's SANs are *.25c-team1.art + apex, so a
      # two-label host would fail the TLS handshake before routing runs at
      # all - not a style choice, the cert literally cannot serve it.
      hostname: "*.25c-team1.art"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            # cert-manager writes this Secret into platform-istio - the same
            # namespace as this Gateway - so no ReferenceGrant is needed.
            # letsencrypt-prod, cut over in
            # clusters/dev/dev-eks-us-east-1/cert-manager-issuers/patch-certificate.yaml
            # once staging proved DNS-01 + IRSA end to end.
            name: wildcard-25c-team1-art-tls
      # Same ownership boundary as the http listener - see its comment
      # above. Both listeners share one selector, so a namespace granted
      # access gets both http and https, never just one.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              u25c.io/istio-gateway-access: "true"
