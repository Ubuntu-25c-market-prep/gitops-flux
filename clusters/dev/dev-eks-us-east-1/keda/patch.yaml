apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  # keda ns doesn't exist on this cluster yet
  install:
    createNamespace: true
  # role arn comes from the sealed secret, overrides base's configmap
  valuesFrom:
    - kind: Secret
      name: keda-irsa
      valuesKey: values.yaml
      optional: false
