apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  chart:
    spec:
      chart: keda
      version: "2.20.2"
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
  interval: 20h0m0s
  targetNamespace: keda
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: keda-irsa
      valuesKey: values.yaml
  values:
    serviceAccount:
      operator:
        name: keda-operator
