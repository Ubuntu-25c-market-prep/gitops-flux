# Velero for dev-eks-us-east-1. Setup steps: docs/velero/README.md.
#
# This lives under clusters/, not infrastructures/dev/dev-eks-us-east-1/: that
# folder has no kustomization.yaml, so everything in it joins the
# `infrastructure` Kustomization, and Velero would then wait on itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 20h0m0s
  retryInterval: 5m0s
  path: ./clusters/dev/dev-eks-us-east-1/velero
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # `infrastructure` provides the vmware-tanzu HelmRepository and the Sealed
  # Secrets controller that decrypts velero-irsa-sealed.yaml.
  dependsOn:
    - name: infrastructure
  # Wait until Sealed Secrets is actually running, not just applied.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sealed-secrets
      namespace: flux-system
  timeout: 5m0s
