# gitops-flux/clusters/dev/dev-eks-us-east-1/cert-manager-issuers
#
# Same cross-directory file-reference pattern as
# clusters/dev/dev-eks-us-east-1/cert-manager/kustomization.yaml - verified
# against `flux build kustomization`, not `kubectl kustomize` (see that
# file's comment for why the two disagree).
#
# Prod cutover: staging proved DNS-01 + IRSA end to end (order valid,
# Ready=True, issued by "(STAGING) Artificial Amaranth YE1"). patch-certificate.yaml
# flips issuerRef to letsencrypt-prod and secretName to the real Secret name
# the Gateway's HTTPS listener names directly - see that file's own header.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../infrastructures/base/cert-manager/clusterissuer-staging.yaml
  - ../../../../infrastructures/base/cert-manager/clusterissuer-prod.yaml
  - ../../../../infrastructures/base/cert-manager/certificate-wildcard.yaml
patches:
  - path: patch-certificate.yaml
    target:
      kind: Certificate
labels:
  - pairs:
      kustomize.toolkit.fluxcd.io/prune: enabled
