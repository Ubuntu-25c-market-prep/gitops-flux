# KEDA for dev-eks-us-east-1. Setup steps: docs/keda/README.md.
#
# This lives under clusters/, not infrastructures/dev/dev-eks-us-east-1/: that
# folder has no kustomization.yaml, so everything in it joins the
# `infrastructure` Kustomization, and KEDA would then wait on itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 20h0m0s
  retryInterval: 5m0s
  path: ./clusters/dev/dev-eks-us-east-1/keda
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # `infrastructure` provides the keda HelmRepository and the Sealed Secrets
  # controller that decrypts sealedsecret.yaml.
  dependsOn:
    - name: infrastructure
  # Wait until Sealed Secrets is actually running, not just applied.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sealed-secrets
      namespace: flux-system
  timeout: 5m0s
