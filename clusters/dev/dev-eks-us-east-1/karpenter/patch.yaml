apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 10m0s # base: 20h
  install:
    createNamespace: true
  # Replaces base's ConfigMap: the role ARN comes from sealedsecret.yaml.
  valuesFrom:
    - kind: Secret
      name: karpenter-irsa
      valuesKey: values.yaml
      optional: false
  values:
    settings:
      clusterName: dev-eks-us-east-1
      interruptionQueue: dev-sqs-karpenter-interruption-us-east-1 # terraform-infra-v2, sqs stack
    replicas: 1 # chart default: 2
    priorityClassName: system-cluster-critical
    # Runs on the system node group: the chart keeps it off nodes Karpenter manages.
    controller:
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
    podLabels:
      environment: dev
    serviceMonitor:
      enabled: true # scraped by kube-prometheus-stack
