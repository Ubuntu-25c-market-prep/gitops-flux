---
# gitops-flux/clusters/dev/25c-shared/argo-bootstrap.yaml
#
# The bootstrap Application gets its OWN Flux Kustomization because it is an
# argoproj.io kind, and that CRD is installed by the argo-cd HelmRelease inside
# the `infrastructure` Kustomization.
#
# kustomize-controller server-side dry-runs a whole path before applying any of
# it. Keeping the Application in `infrastructures/` therefore meant: on a
# cluster without Argo CD, the dry-run failed on an unknown kind, and NOTHING in
# the infrastructure path applied - including the HelmRelease that would have
# created the CRD. Chicken and egg, with every other workstream stopped behind
# it.
#
# dependsOn plus the health check below is the Flux-native answer: this
# Kustomization does not even attempt its dry-run until `infrastructure` is
# applied AND the argo-cd HelmRelease reports Ready, by which point the CRDs
# exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-bootstrap
  namespace: flux-system
spec:
  interval: 20h0m0s
  path: ./clusters/dev/25c-shared/argo-bootstrap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

  # Not just "applied" - Ready. A HelmRelease can be applied while the chart is
  # still installing, and the CRDs land partway through that.
  dependsOn:
    - name: infrastructure

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: argo-cd
      namespace: flux-system
  timeout: 5m
