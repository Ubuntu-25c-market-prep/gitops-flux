---
# gitops-flux/clusters/dev/25c-shared/kyverno-policies.yaml
#
# kyverno-policies gets its OWN Flux Kustomization, and its content directory
# lives here under clusters/ rather than under infrastructures/dev/25c-shared/
# (mirroring argo-bootstrap), for the same CRD-ordering reason: kyverno's
# ClusterPolicy CRD is registered asynchronously by helm-controller while it
# installs the kyverno HelmRelease (applied as part of the `infrastructure`
# Kustomization). Applying ClusterPolicy objects in that same aggregate pass
# races the CRD's existence.
#
# There is no `spec.ignore` on the Kustomization CRD (that field only exists
# on GitRepository/OCIRepository/Bucket) - so the directory can't be excluded
# from the `infrastructure` Kustomization's path after the fact. It has to
# never be under `infrastructures/dev/25c-shared/` in the first place, since
# that path has no committed kustomization.yaml and kustomize-controller
# auto-generates one by recursively walking every subdirectory it finds.
#
# dependsOn plus the health check below is the Flux-native fix: this
# Kustomization does not even attempt its dry-run until `infrastructure` is
# applied AND the kyverno HelmRelease reports Ready - not just applied, since
# a HelmRelease can be applied while the chart is still installing, and the
# CRDs land partway through that - by which point the CRD exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 20h0m0s
  path: ./clusters/dev/25c-shared/kyverno-policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: flux-system
