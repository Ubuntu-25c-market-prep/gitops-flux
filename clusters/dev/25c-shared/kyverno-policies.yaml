---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 20h0m0s
  path: ./infrastructures/dev/25c-shared/kyverno-policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # kyverno's ClusterPolicy CRD is registered asynchronously by helm-controller
  # while it installs the kyverno HelmRelease (applied as part of the
  # "infrastructure" Kustomization). Applying ClusterPolicy objects in that
  # same aggregate pass races the CRD's existence. dependsOn defers this
  # Kustomization until "infrastructure" has completed at all; healthChecks
  # additionally keeps this Kustomization (and its retries) from reporting
  # Ready until the kyverno HelmRelease itself is Ready, by which point the
  # CRD is guaranteed to be registered.
  dependsOn:
    - name: infrastructure
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: flux-system
