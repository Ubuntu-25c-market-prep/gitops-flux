apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: flux-system
spec:
  chart:
    spec:
      chart: fluent-bit
      version: "0.58.1"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  interval: 20h0m0s
  # Pods run in platform-logging alongside Elasticsearch; the HelmRelease
  # object itself stays in flux-system, like every other component here.
  targetNamespace: platform-logging
  # Without this Flux names the release "platform-logging-fluent-bit" and
  # every rendered object inherits the doubled prefix.
  releaseName: fluent-bit
