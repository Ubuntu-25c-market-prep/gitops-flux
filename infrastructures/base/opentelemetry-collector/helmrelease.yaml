# gitops-flux/infrastructures/base/opentelemetry-collector/helmrelease.yaml
#
# Gateway collector: receives OTLP and, for now, only logs what it receives.
#
# There is no trace backend on any cluster yet - Prometheus stores no spans and
# the EFK stack takes logs, not traces. A collector configured to export to a
# backend that does not exist CrashLoops on startup, so the first deployment
# proves the receive path and nothing else. The exporter is replaced once a
# backend lands; the receiver and service wiring do not change when it does.
#
# THE CHART'S `config:` IS DEEP-MERGED WITH ITS DEFAULTS, NOT REPLACED. Left
# alone, the chart also runs jaeger, zipkin and prometheus receivers plus logs
# and metrics pipelines - the prometheus receiver scrapes the collector's own
# metrics every 10s into `debug`, which was the endless log noise after #232.
# Setting a key to null is how a default is removed.
#
# THOSE NULLS MUST STAY IN THIS BASE FILE. In a Kustomize patch, `null` means
# "delete this key" - Kustomize drops it, Helm never sees the null, and the
# chart default comes back with no error anywhere. Verified 2026-10-02:
# nulls here survive kustomize build and server-side apply; nulls in an
# overlay patch do not.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: flux-system
spec:
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.173.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  interval: 20h0m0s
  targetNamespace: monitoring
  # Without this Flux names the release "monitoring-opentelemetry-collector"
  # and every rendered object inherits the doubled prefix.
  releaseName: opentelemetry-collector
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart refuses to render without both of these set explicitly.
    mode: deployment
    image:
      repository: otel/opentelemetry-collector-k8s
    replicaCount: 1
    presets:
      kubernetesAttributes:
        enabled: true
    # Only OTLP is received, so only OTLP is exposed. `metrics` is the
    # collector's own telemetry on 8888, scraped by a ServiceMonitor where
    # the cluster has one (see the dev overlay).
    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      metrics:
        enabled: true
    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch: {}
      exporters:
        debug:
          verbosity: basic
      service:
        pipelines:
          logs: null
          metrics: null
          traces:
            receivers: [otlp]
            # memory_limiter first, batch last. Listing k8s_attributes here
            # stops the preset prepending it ahead of memory_limiter.
            processors: [memory_limiter, k8s_attributes, batch]
            exporters: [debug]
