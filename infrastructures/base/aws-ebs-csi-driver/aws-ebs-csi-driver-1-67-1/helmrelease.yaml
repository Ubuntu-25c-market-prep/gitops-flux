apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-ebs-csi-driver
  namespace: flux-system
spec:
  chart:
    spec:
      chart: aws-ebs-csi-driver
      # Chart 2.67.1 == appVersion 1.67.1, EKS's default (and latest)
      # aws-ebs-csi-driver for Kubernetes 1.35. Sidecar tags below are the
      # chart's own defaults for 2.67.1, pulled from the regional ECR mirror.
      version: "2.67.1"
      sourceRef:
        kind: HelmRepository
        name: aws-ebs-csi-driver
        namespace: flux-system
  interval: 20h0m0s
  # Was suspended while the three immutable-selector objects
  # (Deployment/ebs-csi-controller, DaemonSet/ebs-csi-node,
  # DaemonSet/ebs-csi-node-windows) were deleted and recreated - see #87. Now
  # unsuspended so Git matches the running cluster.
  targetNamespace: kube-system
  releaseName: aws-ebs-csi-driver
  storageNamespace: kube-system
  # The IRSA role ARN embeds the AWS account id and this repo is public, so it
  # is NOT committed. Supplied by an out-of-band ConfigMap, the same pattern
  # karpenter uses:
  #
  #   ARN=$(terraform -chdir=infra-aws/eks output -raw ebs_csi_irsa_role_arn)
  #   kubectl create configmap ebs-csi-irsa -n flux-system \
  #     --from-literal=values.yaml="controller:
  #     serviceAccount:
  #       annotations:
  #         eks.amazonaws.com/role-arn: ${ARN}"
  valuesFrom:
    - kind: ConfigMap
      name: ebs-csi-irsa
      valuesKey: values.yaml
      optional: false
  values:
    # EKS-distribution images. The chart defaults to public.ecr.aws upstream
    # builds; the cluster runs AWS's eksbuild images from the regional ECR.
    image:
      repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/aws-ebs-csi-driver
      tag: v1.67.1
    sidecars:
      provisioner:
        image:
          repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/csi-provisioner
          tag: v6.4.0-eksbuild.2
      attacher:
        image:
          repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/csi-attacher
          tag: v4.13.0-eksbuild.2
      snapshotter:
        # The chart leaves this sidecar OFF by default, but the running
        # controller has it. Without forceEnable, adopting would delete the
        # csi-snapshotter container - restarting the controller and removing
        # VolumeSnapshot support.
        forceEnable: true
        image:
          repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/csi-snapshotter
          tag: v8.7.0-eksbuild.1
      resizer:
        image:
          repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/csi-resizer
          tag: v2.3.0-eksbuild.2
      livenessProbe:
        image:
          repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/livenessprobe
          tag: v2.20.0-eksbuild.2
      nodeDriverRegistrar:
        image:
          repository: 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/csi-node-driver-registrar
          tag: v2.18.0-eksbuild.2
    controller:
      # Pinned, not left to the chart's fullname template: the IRSA trust
      # policy in infra-aws is scoped to subject
      # system:serviceaccount:kube-system:ebs-csi-controller-sa. A different
      # name means AssumeRoleWithWebIdentity is AccessDenied and no volume can
      # be provisioned.
      serviceAccount:
        name: ebs-csi-controller-sa
