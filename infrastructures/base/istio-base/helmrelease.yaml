apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: flux-system
spec:
  chart:
    spec:
      chart: base
      version: "1.30.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  interval: 1h0m0s
  # CRDs and cluster-scoped resources only - no running workload, so no
  # resource requests to tune here.
  targetNamespace: platform-istio
  releaseName: istio-base
  install:
    createNamespace: true
