apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: flux-system
spec:
  chart:
    spec:
      chart: base
      version: "1.30.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  interval: 1h0m0s
  # CRDs and cluster-scoped resources only - no running workload, so no
  # resource requests to tune here.
  targetNamespace: platform-istio
  releaseName: istio-base
  install:
    createNamespace: true
  values:
    # targetNamespace alone does NOT relocate Istio - the chart has its own
    # separate global.istioNamespace (default "istio-system") controlling
    # where ClusterRoleBinding subjects and other cluster-scoped bindings
    # point, independent of Release.Namespace. Without this, install fails
    # outright: "namespaces \"istio-system\" not found". Every Istio
    # component (istiod, gateway, Kiali) must set this to the same value.
    global:
      istioNamespace: platform-istio
