apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  chart:
    spec:
      chart: karpenter
      version: "1.14.0"
      sourceRef:
        kind: HelmRepository
        name: karpenter
        namespace: flux-system
  interval: 20h0m0s
  # Pods run in the karpenter namespace (created by 000-cluster-wide-resources);
  # the HelmRelease object itself stays in flux-system.
  targetNamespace: karpenter
  # The chart ships its own CRDs (nodepools, ec2nodeclasses, nodeclaims, ...).
  # Helm installs CRDs from crds/ on install but never upgrades them, so let
  # Flux own their lifecycle instead.
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # The controller's IRSA role ARN embeds the AWS account id, and this repo is
  # public, so it is NOT committed. It is supplied by an out-of-band ConfigMap
  # (karpenter-irsa) in flux-system, created from the terraform output:
  #
  #   ARN=$(terraform -chdir=infra-aws/karpenter output -raw controller_role_arn)
  #   kubectl create configmap karpenter-irsa -n flux-system \
  #     --from-literal=values.yaml="serviceAccount:
  #     annotations:
  #       eks.amazonaws.com/role-arn: ${ARN}"
  #
  # valuesFrom merges after spec.values, so this only sets the SA annotation.
  valuesFrom:
    - kind: ConfigMap
      name: karpenter-irsa
      valuesKey: values.yaml
      optional: false
  values:
    # Pin the ServiceAccount name. Flux composes the Helm release name as
    # <targetNamespace>-<name> ("karpenter-karpenter") because releaseName is
    # unset, and the chart derives the SA name from that fullname. The IRSA
    # trust policy (infra-aws) only allows subject
    # system:serviceaccount:karpenter:karpenter, so without this the pod's SA
    # is "karpenter-karpenter" and AssumeRoleWithWebIdentity is AccessDenied.
    serviceAccount:
      name: karpenter
    # Cluster name and interruption queue name are both "u25c-shared" - not
    # account-identifying, safe to commit. Environment-specific tuning
    # (replicas, resources) is layered in the dev overlay's patch.
    settings:
      clusterName: u25c-shared
      interruptionQueue: u25c-shared
