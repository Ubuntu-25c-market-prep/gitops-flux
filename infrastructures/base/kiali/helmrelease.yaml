apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kiali-server
      version: "2.30.0"
      sourceRef:
        kind: HelmRepository
        name: kiali
        namespace: flux-system
  interval: 1h0m0s
  targetNamespace: platform-istio
  releaseName: kiali
  install:
    createNamespace: true
  # Kiali reads Istio config (Gateway, VirtualService, ...) and mesh state
  # cluster-wide via RBAC (deployment.cluster_wide_access: true, the chart
  # default) rather than a hardcoded istiod address, so no dependency on
  # istiod's exact revisioned name is needed here. It does need the CRDs
  # from istio-base to exist for that RBAC/API discovery to mean anything.
  dependsOn:
    - name: istio-base
      namespace: flux-system
