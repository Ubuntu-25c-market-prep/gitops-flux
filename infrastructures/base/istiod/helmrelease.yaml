apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  chart:
    spec:
      chart: istiod
      version: "1.30.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  interval: 1h0m0s
  targetNamespace: platform-istio
  releaseName: istiod
  install:
    createNamespace: true
  # istiod expects its CRDs (VirtualService, Gateway, ...) to already exist -
  # without them it starts but repeatedly fails to establish the watches it
  # needs. This is HelmRelease's own dependsOn, not a Kustomization-level
  # one: kustomize-controller applies every object in this repo's single
  # aggregate Kustomization in one pass, so nothing else sequences these two
  # Helm installs relative to each other. helm-controller enforces the wait.
  dependsOn:
    - name: istio-base
      namespace: flux-system
  values:
    # Must match istio-base's global.istioNamespace exactly - istiod uses
    # this to find its own webhook/CRD configuration, not just to locate
    # itself. Every future Istio component (gateway, Kiali) needs the same
    # value.
    global:
      istioNamespace: platform-istio
