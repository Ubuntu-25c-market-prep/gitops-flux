# gitops-flux/infrastructures/base/authentik/authentik-secrets-sealed.yaml
#
# Two SealedSecrets, not one, and that is not tidiness - the two consumers
# cannot read the same key names.
#
#   authentik-secrets     -> mounted by the authentik server and worker with
#                            `envFrom`, so every key becomes an environment
#                            variable and the key names must BE the variable
#                            names. Confirmed by rendering the chart, not
#                            assumed.
#   authentik-postgresql  -> read by the bundled Bitnami PostgreSQL subchart via
#                            `auth.existingSecret`, which looks for keys called
#                            `password` and `postgres-password`.
#
# Merging them would put `postgres-password` into authentik's environment, and a
# hyphen is not legal in an environment variable name. Kubernetes drops such keys
# silently and records an InvalidVariableNames event - the pod starts, the
# variable is simply absent, and nothing points at the cause.
#
# THE VALUE THAT MUST MATCH: authentik-secrets/AUTHENTIK_POSTGRESQL__PASSWORD and
# authentik-postgresql/password are the SAME password - the one belonging to the
# `authentik` database user. PostgreSQL sets it on first boot; authentik connects
# with it. If they ever drift, the server crash-loops on a connection error that
# does not mention passwords.
#
# `postgres-password` is DIFFERENT on purpose. That is the `postgres` superuser,
# which authentik never uses (it connects as `authentik` to the `authentik`
# database - see the chart's postgresql.auth defaults). Reusing one value would
# make an application credential a superuser credential.
#
# Sealed with the strict default scope: bound to both the name and the namespace
# above. Renaming either means resealing from the original plaintext, which no
# longer exists - regenerate instead.
#
# No SMTP password here yet. It arrives in its own PR once the sender is chosen,
# and is needed before Stage 05 creates real accounts, not before.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-secrets
  namespace: platform-auth
spec:
  encryptedData:
    AUTHENTIK_POSTGRESQL__PASSWORD: 
    AUTHENTIK_SECRET_KEY: 
  template:
    metadata:
      name: authentik-secrets
      namespace: platform-auth
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-postgresql
  namespace: platform-auth
spec:
  encryptedData:
    password: 
    postgres-password: 
  template:
    metadata:
      name: authentik-postgresql
      namespace: platform-auth
