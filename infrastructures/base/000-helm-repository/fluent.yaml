# gitops-flux/infrastructures/base/000-helm-repository/fluent.yaml
# Source for the fluent-bit chart (EFK's log shipper). Same vendor publishes
# fluentd and fluent-operator, so this entry is reusable.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluent
  namespace: flux-system
spec:
  interval: 24h
  url: https://fluent.github.io/helm-charts
