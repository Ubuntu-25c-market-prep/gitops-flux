# gitops-flux/infrastructures/base/000-helm-repository/elastic.yaml
# One source serves every chart Elastic publishes; the EFK epic starts with
# eck-operator and reuses this entry for anything else from helm.elastic.co.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: elastic
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.elastic.co
