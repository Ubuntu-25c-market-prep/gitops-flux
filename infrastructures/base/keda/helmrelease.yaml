apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  chart:
    spec:
      chart: keda
      version: "2.20.2"
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
  interval: 20h0m0s
  # Pods run in the keda namespace (created by 000-cluster-wide-resources).
  targetNamespace: keda
  # KEDA ships its CRDs (scaledobjects, scaledjobs, triggerauthentications, ...).
  # Let Flux manage their lifecycle rather than Helm's install-only behaviour.
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # Core install only - operator + metrics apiserver. No AWS IAM: AWS-based
  # scalers (SQS depth, CloudWatch) would need an IRSA role added later.
  values: {}
