apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      # cert-manager chart versions carry the leading "v".
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  interval: 20h0m0s
  # Pods run in the cert-manager namespace (created by
  # 000-cluster-wide-resources); the HelmRelease object stays in flux-system.
  targetNamespace: cert-manager
  # Without this Flux composes the release name as <targetNamespace>-<name>
  # ("cert-manager-cert-manager") and every rendered resource inherits that
  # doubled prefix. Same choice istiod made in #71.
  releaseName: cert-manager
  values:
    # Since chart v1.15 cert-manager renders its CRDs as ordinary templates
    # (they are NOT in the chart's crds/ directory), so Helm - and therefore
    # Flux - upgrades them normally. This is why there is no
    # install.crds/upgrade.crds block here, unlike karpenter.
    # crds.keep defaults to true, so an accidental uninstall will not delete
    # Certificate objects.
    crds:
      enabled: true
    # Stated explicitly rather than left to the chart's fullname template:
    # Stage 2 adds an IRSA trust policy scoped to subject
    # system:serviceaccount:cert-manager:cert-manager, and this line is the
    # other half of that contract. Karpenter learned this the hard way in #70.
    serviceAccount:
      name: cert-manager