apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: 90dmytro90@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          route53:
            # No accessKeyID/secretAccessKeySecretRef here: the cert-manager
            # pod authenticates via IRSA (the ServiceAccount annotation wired
            # in helmrelease.yaml), so the AWS SDK picks up credentials, role,
            # and region from the pod's environment automatically.
            region: us-east-1
            # hostedZoneID intentionally omitted: there is only one public
            # zone (25c-team1.art), so auto-discovery by domain name is
            # unambiguous and there is nothing to gain from hardcoding it.
