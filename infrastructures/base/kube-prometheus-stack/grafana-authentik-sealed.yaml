# gitops-flux/infrastructures/base/kube-prometheus-stack/grafana-authentik-sealed.yaml
#
# Grafana's OAuth credentials for authentik (Stage 07 of the SSO rollout).
#
# KEY NAMES USE UNDERSCORES AND AN `authentik_` PREFIX, and both halves of that
# matter:
#
#   underscores - Grafana consumes these through envFromSecrets, so each key
#     becomes an ENVIRONMENT VARIABLE NAME. A hyphen is not legal in one;
#     Kubernetes drops such keys silently and records InvalidVariableNames. The
#     pod starts, the variable is simply absent, and the login failure points
#     nowhere near the cause.
#
#   the prefix - grafana-github-oauth already occupies `client_id` and
#     `client_secret` in that same flattened environment. Reusing them would
#     have one secret shadow the other, and the symptom would read as bad
#     credentials rather than as two secrets colliding. The prefix goes away
#     when auth.github is retired and this can take the plain names.
#
# Read out of authentik's own database rather than retyped from the admin UI -
# the client secret is 128 characters.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-authentik-oauth
  namespace: monitoring
spec:
  encryptedData:
    authentik_client_id: 
    authentik_client_secret: 
  template:
    metadata:
      name: grafana-authentik-oauth
      namespace: monitoring
