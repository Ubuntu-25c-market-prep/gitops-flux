apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-overview.json: |
    {
      "annotations": { "list": [] },
      "title": "Platform Overview",
      "uid": "platform-overview",
      "version": 1,
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "title": "Cluster CPU Usage %",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "targets": [{
            "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
            "legendFormat": "CPU %"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          }
        },
        {
          "title": "Cluster Memory Usage %",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "targets": [{
            "expr": "(1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100",
            "legendFormat": "Memory %"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          }
        },
        {
          "title": "Pods Running vs Failed",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "Running"
            },
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Failed\"})",
              "legendFormat": "Failed"
            }
          ]
        },
        {
          "title": "Node Count",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "targets": [{
            "expr": "count(kube_node_info)",
            "legendFormat": "Nodes"
          }]
        },
        {
          "title": "CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 8 },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace)",
            "legendFormat": "{{namespace}}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "title": "Memory Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 8 },
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{container!=\"\"}) by (namespace)",
            "legendFormat": "{{namespace}}"
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "title": "Pod Restarts by Namespace (last 1h)",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 18 },
          "targets": [{
            "expr": "sum(increase(kube_pod_container_status_restarts_total[1h])) by (namespace)",
            "legendFormat": "{{namespace}}"
          }]
        },
        {
          "title": "PVC Usage %",
          "type": "table",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 18 },
          "targets": [{
            "expr": "(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100",
            "legendFormat": "{{persistentvolumeclaim}}",
            "format": "table",
            "instant": true
          }],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        }
      ],
      "schemaVersion": 39,
      "templating": { "list": [] }
    }
