apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "72.6.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 20h0m0s
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  targetNamespace: monitoring
  values:
    prometheus:
      prometheusSpec:
        retention: 15d
        thanos:
          objectStorageConfig:
            name: thanos-objstore-secret
            key: objstore.yml
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: ${THANOS_ROLE_ARN}
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
    grafana:
      persistence:
        enabled: true
        size: 5Gi
        accessModes:
          - ReadWriteOnce
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
