apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: platform.pods
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "More than 5 restarts in the last 15 minutes."

        - alert: PodNotReady
          # `unless` excludes pods that finished SUCCESSFULLY. A completed Job
          # pod reports ready=false forever, so without this the alert fires on
          # every successful run of every CronJob and never resolves until the
          # pod is garbage-collected.
          #
          # Observed 17 Oct 2026: the hourly platform-logging `logs-ilm` job
          # kept this alert firing continuously while succeeding every time.
          # A warning that is always on, always wrong and hourly is worse than
          # no warning - it teaches people to ignore the channel.
          #
          # Failed pods are deliberately still caught: phase=Failed is not
          # excluded, only phase=Succeeded.
          expr: |
            kube_pod_status_ready{condition="true"} == 0
              unless on(namespace, pod)
            kube_pod_status_phase{phase="Succeeded"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready for 10m"

    - name: platform.nodes
      rules:
        - alert: NodeHighCPU
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} CPU above 85% for 10m"

        - alert: NodeHighMemory
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} memory above 85% for 10m"

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"

    - name: platform.storage
      rules:
        - alert: PVCAlmostFull
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is above 85%"
