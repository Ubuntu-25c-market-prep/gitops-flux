apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  chart:
    spec:
      chart: sealed-secrets
      version: "2.17.2"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
  interval: 20h0m0s
  install:
    createNamespace: true
  targetNamespace: sealed-secrets
  values:
    createController: true
    rbac:
      create: true
    serviceAccount:
      create: true
    secretName: "sealed-secrets-key"
