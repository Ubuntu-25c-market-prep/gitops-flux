apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kyverno
      version: "3.9.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  interval: 20h0m0s
  # Pods run in the kyverno namespace (created by 000-cluster-wide-resources).
  targetNamespace: kyverno
  # Kyverno ships its CRDs (clusterpolicies, policyreports, ...). Let Flux
  # manage their lifecycle rather than Helm's install-only behaviour.
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values: {}
