# The cpu request matches the live DaemonSet. base/ sets no resources at all,
# so without this the request would be removed and every kube-proxy pod would
# restart for no reason.
#
# The image is NOT pinned here any more: it comes from the versioned base
# folder named in kustomization.yaml.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-proxy
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: kube-proxy
          resources:
            requests:
              cpu: 100m
