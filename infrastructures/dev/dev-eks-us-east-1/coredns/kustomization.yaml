# gitops-flux/infrastructures/dev/dev-eks-us-east-1/coredns
#
# Points at base/coredns-helm, NOT base/coredns. This cluster installs CoreDNS
# from the chart; 25c-shared runs the plain manifests it adopted from EKS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/coredns-helm
patches:
  - path: patch.yaml
    target:
      kind: HelmRelease
labels:
  - pairs:
      kustomize.toolkit.fluxcd.io/prune: enabled
