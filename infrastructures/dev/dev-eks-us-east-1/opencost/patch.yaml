# gitops-flux/infrastructures/dev/dev-eks-us-east-1/opencost/patch.yaml
#
# Dev-only: cluster identity, sizing and placement.
#
# Placement: the monitoring pool, dev-np-monitoring-spot-od-us-east-1
# (docs/karpenter/README.md), next to the Prometheus it scrapes. This
# cluster's pools are keyed on `workload`/`dedicated`, not 25c-shared's
# `u25c.io/pool` - do not copy that block across. Selector AND toleration
# are both required: the pool is tainted dedicated=monitoring:NoSchedule and
# a selector alone leaves the pod Pending. The chart reads these under
# `opencost.*` (templates/deployment.yaml, verified on 2.5.30); top-level
# keys are ignored. Stateless singleton with no PVC, so a spot interruption
# costs one restart and a cost-data gap of the same length.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
  namespace: flux-system
spec:
  values:
    podLabels:
      environment: dev
      workstream: finops
    opencost:
      nodeSelector:
        workload: monitoring
      tolerations:
        - key: dedicated
          value: monitoring
          effect: NoSchedule
      exporter:
        # The base HelmRelease hardcodes `defaultClusterId: u25c-shared` (see
        # infrastructures/base/opencost/helmrelease.yaml - it is not
        # templated). Without this override, every cost metric from this
        # cluster would be mislabeled as belonging to 25c-shared.
        defaultClusterId: dev-eks-us-east-1
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 512Mi
      ui:
        resources:
          requests:
            cpu: 10m
            memory: 55Mi
          limits:
            memory: 128Mi
