# gitops-flux/infrastructures/dev/dev-eks-us-east-1/kibana/kibana.yaml
# The Kibana instance - an ECK custom resource, reconciled by the eck-operator
# in this namespace. Overlay-only, no base/: version and sizing are per-cluster
# decisions and dev upgrades first, the same reasoning elasticsearch/ uses.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: platform
  namespace: platform-logging
spec:
  # Must not be newer than the Elasticsearch it talks to - Kibana refuses to
  # start against an older Elasticsearch. Bump this only with elasticsearch.yaml.
  version: 9.5.2
  count: 1
  # The whole connection, in one line. ECK creates a dedicated internal user
  # for Kibana in Elasticsearch, mounts the CA so TLS verifies, and writes the
  # URL into Kibana's config. No credentials are configured here or committed.
  elasticsearchRef:
    name: platform
  podTemplate:
    spec:
      # No nodeSelector / tolerations: this cluster has no pools yet.
      priorityClassName: system-cluster-critical
      containers:
        - name: kibana
          env:
            # Kibana runs on Node.js, which sizes its heap from the cgroup
            # limit and then overshoots it: on 25c-shared a 1Gi limit was
            # OOM-killed and had to be raised to 2Gi (#188). Here the heap is
            # capped explicitly instead, so the limit can stay under 2Gi.
            #
            # 600 MB was too small: Kibana 9.5 needs ~800 MB of heap just to
            # finish starting, and crashed 78 times at "heap out of memory"
            # with the heap at 590 of 600 MB before serving a request.
            # 1024 MB leaves it room to start and to answer Discover queries;
            # the limit above it covers the non-heap parts of the process.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1536Mi
