# gitops-flux/infrastructures/dev/dev-eks-us-east-1/000-cluster-wide-resources/namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Already on the cluster, created by Helm (install.createNamespace: true).
  # These files adopt them into Git; the HelmReleases are unchanged.
  - platform-istio.yaml
  - sealed-secrets.yaml
  - cert-manager.yaml
  # New with kube-prometheus-stack, not adopted.
  - monitoring.yaml

  # New with Teleport, not adopted. Both HelmReleases set
  # install.createNamespace: false so one controller owns the object -
  # these two files ARE that owner.
  - teleport.yaml
  - teleport-agent.yaml

  # New with Argo CD, not adopted. The control plane namespace, and the
  # business dev environment Argo CD deploys into. Flux owns both namespaces;
  # gitops-argocd owns only the argoproj.io resources that appear inside them
  # (ADR 0015). app-dev carries its ResourceQuota and LimitRange in the same
  # file, because they are one decision.
  - argocd.yaml
  - app-dev.yaml

  # Not yet on the cluster: declared here first, so the logging overlays can
  # target it. Elasticsearch, Kibana, Fluent Bit and the ILM CronJob live here.
  - platform-logging.yaml

  # New with the ELK (Elasticsearch + Logstash + Kibana) stack - a separate,
  # plain-Helm-chart Elastic stack from platform-logging's ECK-managed one, so
  # it gets its own namespace rather than sharing platform-logging.
  - logging-elk.yaml

  # NEVER add kube-system or flux-system here. Pruning is on, so deleting such
  # a file later would make Flux delete the namespace - for flux-system, Flux
  # itself.
