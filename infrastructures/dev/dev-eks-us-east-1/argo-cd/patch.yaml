# Dev sizing for dev-eks-us-east-1, and the removal of the base's SSO config.
#
# One replica of everything. This is a two-node cluster and Argo CD's own
# availability is not what the environment is for - if the control plane is
# down, git is still the source of truth and nothing has drifted.
#
# ---------------------------------------------------------------------------
# REACHED THROUGH TELEPORT - still no SSO, and that distinction matters
# ---------------------------------------------------------------------------
# Argo CD is registered as a Teleport application (teleport-agent overlay) and
# reached at https://argocd.teleport.25c-team1.art. There is still NO Ingress
# and no LoadBalancer Service: Teleport is the only route in, it enforces a
# local account plus a mandatory second factor, and every session is audited.
# ADR 0016 records why Teleport is the access model on this cluster.
#
# WHAT THIS DOES NOT DO: it is not single sign-on.
#
# Grafana sits behind the same door AND consumes the JWT Teleport forwards
# (`auth.jwt`), so one login covers both. Argo CD has no equivalent - its only
# authentication paths are local accounts and OIDC/Dex, and neither reads a
# proxy-supplied header. So Argo CD still presents its own login form and
# `admin.enabled` stays TRUE. You authenticate twice: once to Teleport, once
# to Argo CD.
#
# That is a real improvement over what it replaced - the UI was previously
# reachable only by `kubectl port-forward`, so it was effectively unusable by
# the team - but do not read "behind Teleport" as "SSO is done".
#
# The password is still generated in-cluster into argocd-initial-admin-secret
# and never enters git. What changed is that reaching the login form now
# requires passing Teleport first, rather than holding cluster credentials.
#
# ---------------------------------------------------------------------------
# CLOSING THE SSO GAP - two routes, neither taken here
# ---------------------------------------------------------------------------
# 1. A real identity provider. The base's `oidc.config` block is written and
#    waiting; authentik ran on 25c-shared and is gone (no namespace here, no
#    auth.25c-team1.art record, and its SealedSecret is encrypted to that
#    cluster's controller key, so it cannot be copied). Restoring it means a
#    new deployment, roughly 1280Mi of requests and an 8Gi volume, plus a DNS
#    record. When it exists, ONE PR restores oidc.config with this cluster's
#    issuer, adds the client secret RESEALED with this cluster's certificate,
#    and flips `admin.enabled` to false.
#
# 2. Dex's `authproxy` connector, trusting a header Teleport rewrites. The
#    chart bundles Dex (`dex.enabled` is false today) and Teleport can inject
#    headers into proxied requests, so this could give real SSO with no new
#    infrastructure. It is NOT done here because a header-trust connector is
#    only safe while nothing can reach the Service except the proxy, and that
#    property deserves to be asserted and tested deliberately rather than
#    assumed - not bundled into a change about reachability.
#
# Either route also wants the RBAC in base to become live: `policy.csv`
# already names groups (cto, pm, devops) and is inert until a connector
# supplies them.
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-cd
  namespace: flux-system
spec:
  values:
    configs:
      cm:
        # Strategic-merge null: deletes the key the base sets. Not an empty
        # string - an empty oidc.config is still a configured-but-broken
        # provider to Argo CD.
        oidc.config: null

        # The base value is argocd.25c-team1.art, which is 25c-shared's
        # hostname - and that cluster is being torn down. This field is NOT
        # cosmetic: Argo CD builds every absolute URL it emits from it, so a
        # stale hostname sends UI deep links and any webhook or notification
        # callback at a host that is going away.
        #
        # There is no ingress on this cluster yet, so the honest value is the
        # in-cluster Service. Plain http and port 80 because the base sets
        # `server.insecure: true`; the Service is argocd-argo-cd-server because
        # the base sets no releaseName, so Flux derives it from
        # <targetNamespace>-<name> = argocd-argo-cd (the same default that
        # produced karpenter-karpenter).
        #
        # This becomes the real external hostname in the PR that adds the
        # ingress/HTTPRoute - the SAME change that adds the OIDC connector and
        # its resealed SealedSecret and flips admin.enabled to false. Those
        # four belong together: a reachable Argo CD with a shared admin
        # password is the thing none of them is safe without.
        url: https://argocd.teleport.25c-team1.art

    controller:
      replicas: 1
    repoServer:
      replicas: 1
    server:
      replicas: 1
    applicationSet:
      replicas: 1
    redis-ha:
      enabled: false
