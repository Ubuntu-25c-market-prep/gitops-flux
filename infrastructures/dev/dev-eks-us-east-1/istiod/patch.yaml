apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  values:
    # Revisioned install from day one, matching 25c-shared's reasoning
    # (infrastructures/dev/25c-shared/istiod/patch.yaml) - retrofitting a
    # revision after the fact means reinstalling rather than adding one.
    revision: "1-30-3"
    global:
      proxy:
        # Chart default limits (cpu: 2000m, memory: 1024Mi) are sized for
        # hundreds of proxies across a large mesh, not this 2x t3.medium
        # cluster (2 vCPU / 4GiB allocatable per node) - a single proxy at
        # the default limit alone would reserve half a node. Copied from
        # 25c-shared, which hit exactly this class of problem
        # (gitops-argocd#11) before landing on this value; no reason to
        # rediscover it here.
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
    pilot:
      # Chart default requests (cpu: 500m, memory: 2048Mi) alone reserve a
      # quarter of a node's CPU and two-thirds of a node's memory for a
      # control plane serving a handful of proxies on this cluster.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      # Chart default is true, and this cluster has no metrics-server
      # (unlike 25c-shared) - an HPA with no metrics source doesn't fail
      # loudly, it just sits logging "unable to get metrics for resource
      # cpu" forever. Pin to a single replica instead of leaving a
      # permanently-degraded object nobody asked for.
      autoscaleEnabled: false
      replicaCount: 1

    # No meshConfig.localityLbSetting here, unlike 25c-shared's istiod
    # patch: that's a cross-AZ cost control for a mesh with enough
    # replicated backends for locality preference to matter. A single
    # istiod replica has nothing to prefer locally. Revisit once app
    # workloads with real cross-AZ replica spread land here.

    # No nodeSelector/tolerations here, unlike 25c-shared's istiod patch:
    # this cluster has no `u25c.io/pool` node labels or taints at all (its
    # managed node group's k8s_labels/k8s_taints are unset in
    # terraform-infra-v2) - copying that block would leave istiod Pending
    # forever against a label that exists on no node. Revisit once this
    # cluster grows dedicated pools (ops-program/docs/node-placement.md).
    #
    # Istiod is still on the admission path (every injected pod's sidecar
    # depends on it), so it keeps the same priority class as 25c-shared.
    priorityClassName: system-cluster-critical
