apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport
  namespace: flux-system
spec:
  values:
    # clusterName IS THE CLUSTER'S IDENTITY AND CANNOT BE CHANGED IN PLACE.
    #
    # It is baked into the cluster's certificate authority the first time the
    # auth service starts. Editing it on a running deployment does not rename
    # anything - the CA on the PVC still carries the old name.
    #
    # This was set here on 26 August and DID NOT TAKE, because the PVC was
    # never actually deleted. `tctl status` reported
    # u25c-shared-dev.teleport.local for a further twelve days while this file
    # claimed otherwise, and the mismatch broke the Kubernetes join method: the
    # agent's ServiceAccount token carried the configured name while the auth
    # service validated against the real one. Fixed 7 September by deleting the
    # PVC for real; `tctl status` now agrees with this line.
    #
    # Nothing checks that config matches the CA. If this is edited again,
    # verify with `tctl status` rather than assuming.
    clusterName: teleport.25c-team1.art

    # base/teleport-cluster/helmrelease.yaml hardcodes `u25c-shared` - the name
    # `tsh kube ls` shows. Left alone, this cluster would be labelled with the
    # name of the one being decommissioned, and nothing would error. Matches the
    # EKS cluster name in terraform-infra-v2.
    kubeClusterName: dev-eks-us-east-1

    # ---------------------------------------------------------------------
    # EXPOSURE: TLS passthrough on the SHARED Gateway NLB - no Service of its own
    # ---------------------------------------------------------------------
    #
    # base/teleport-cluster sets `service.type: ClusterIP` and this overlay no
    # longer overrides it. Traffic arrives through the shared Istio Gateway's
    # existing NLB, on two TLS passthrough listeners, and reaches these pods via
    # a TLSRoute:
    #
    #   clusters/dev/dev-eks-us-east-1/gateway-api/gateway.yaml
    #   clusters/dev/dev-eks-us-east-1/gateway-api/tlsroute-teleport.yaml
    #
    # This REPLACES what gitops-flux#217 landed - a LoadBalancer Service with
    # AWS Load Balancer Controller annotations and an external-dns hostname,
    # mirroring 25c-shared. That NLB was never created: the org SCP
    # `u25c-org-cost-freeze` denies elasticloadbalancing:CreateLoadBalancer,
    # attached automatically by a budget action when spend breached the ceiling.
    #
    # Adding listeners to an existing load balancer is not denied, so this is
    # both ~$17/month cheaper and the only design that can be applied while the
    # freeze holds.
    #
    # WHAT MUST NOT CHANGE HERE
    #
    # proxyListenerMode stays `multiplex` (inherited from base). Passthrough
    # only works because Teleport still terminates its own TLS and multiplexes
    # web, SSH, the Kubernetes API and reverse tunnels over one port by ALPN.
    # The proxy's advertised address is still teleport.25c-team1.art:443, which
    # is what the Gateway's NLB serves - the agent registers by dialling that
    # advertised address, so it and the exposure have to agree.
    #
    # No external-dns hostname annotation belongs on this Service any more.
    # external-dns publishes the record from the Gateway via its
    # `gateway-tlsroute` source - see that overlay.

    # ---------------------------------------------------------------------
    # CERTIFICATE
    # ---------------------------------------------------------------------
    #
    # The chart creates and owns its own Certificate, rather than a hand-written
    # one in this directory, because the proxy has to be restarted when the
    # Secret changes and the chart already wires that up.
    #
    # Reuses the letsencrypt-prod ClusterIssuer that cert-manager already runs
    # with the Route 53 DNS-01 solver (gitops-flux#146). DNS-01 matters here:
    # HTTP-01 would need the name to resolve and serve before the certificate
    # exists, which is the chicken-and-egg that made `acme: true` unattractive.
    #
    # This is what finally removes the self-signed certificate. Every TLS
    # failure on 7 September traces back to it - the agent could not verify a
    # certificate naming teleport.25c-team1.art when dialling an in-cluster
    # address, and the browser cannot either.
    highAvailability:
      certManager:
        enabled: true
        issuerKind: ClusterIssuer
        issuerName: letsencrypt-prod
        # The wildcard is added AUTOMATICALLY by the chart (which is what the
        # old suppressAutomaticWildcards was suppressing). Nothing to set.
        addCommonName: false

    # acme: false stays inherited from base. cert-manager above does the
    # issuance; enabling both would have two things racing for the same names.