# gitops-flux/infrastructures/dev/dev-eks-us-east-1/opentelemetry-collector
#
# Takes the base unchanged apart from resource limits. Pods land in
# monitoring rather than a namespace of their own: the namespace list in
# 000-cluster-wide-resources/ is @flux-owned, and monitoring already exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/opentelemetry-collector
patches:
  - path: patch.yaml
    target:
      kind: HelmRelease
labels:
  - pairs:
      kustomize.toolkit.fluxcd.io/prune: enabled
