# gitops-flux/infrastructures/dev/dev-eks-us-east-1/opentelemetry-collector/patch.yaml
# Bounded so a burst of spans cannot evict anything already running on the
# pool node it shares with Prometheus.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: flux-system
spec:
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

    # Placement: the monitoring pool, dev-np-monitoring-spot-od-us-east-1
    # (docs/karpenter/README.md), with the rest of the monitoring namespace
    # (#244). Selector AND toleration are both required: the pool is tainted
    # dedicated=monitoring:NoSchedule and a selector alone leaves the pod
    # Pending. The chart reads both at the top level (templates/_pod.tpl,
    # verified on 0.173.1). One stateless replica with no volume, so a spot
    # interruption costs one restart and the default RollingUpdate is fine.
    nodeSelector:
      workload: monitoring
    tolerations:
      - key: dedicated
        value: monitoring
        effect: NoSchedule

    # Collector self-metrics (port 8888) into the existing Prometheus. Its
    # serviceMonitorSelector is empty, so no release label is needed. Kept out
    # of the base: a cluster without the ServiceMonitor CRD would fail the
    # Helm install.
    serviceMonitor:
      enabled: true

    # Stamp every span with the cluster it came from, so data stays
    # attributable if a second cluster ever sends here. Cluster-specific, so
    # it lives in this overlay; the processor list is restated in full
    # because a patch replaces lists rather than merging them.
    config:
      # Traces to Jaeger in this namespace. Kept in the overlay: the endpoint is
      # this cluster's Service. `otlp_grpc` is the current name of the OTLP
      # exporter - `otlp` is deprecated and only auto-rewritten by the chart.
      # debug stays alongside for now so arrival can be confirmed in the logs.
      exporters:
        otlp_grpc/jaeger:
          endpoint: jaeger.monitoring.svc.cluster.local:4317
          tls:
            insecure: true
      processors:
        resource/cluster:
          attributes:
            - key: k8s.cluster.name
              value: dev-eks-us-east-1
              action: upsert
      service:
        pipelines:
          traces:
            processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
            exporters: [debug, otlp_grpc/jaeger]
