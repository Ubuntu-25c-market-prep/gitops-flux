# gitops-flux/infrastructures/dev/dev-eks-us-east-1/kube-prometheus-stack/patch.yaml
#
# PHASES 2-4 of the monitoring rebuild: Prometheus, Grafana, Alertmanager.
# Still to come: alert routing in phase 5 (gitops-flux#37's unfinished half)
# and S3 retention tiering in phase 6 (#35).
#
# The Grafana and Alertmanager blocks below are restored from the overlay this
# cluster ran before the rebuild (40d5170^), not written fresh - including the
# Teleport JWT config, which was worked out there and is reproduced as-is.
#
# base/ was written for 25c-shared and assumes Thanos, authentik and an IRSA
# ConfigMap, none of which exist on this cluster. So this overlay SUBTRACTS as
# much as it adds - see the `null`s below, and the $patch: delete blocks in
# kustomization.yaml for the two resources that are not values.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  # base reads a `prometheus-irsa` ConfigMap that only exists on 25c-shared.
  # A HelmRelease is a CRD, so this is a JSON merge patch: null REMOVES the
  # key rather than setting it empty. Leave it and the release blocks forever
  # waiting for a ConfigMap nothing creates.
  valuesFrom: null

  values:
    prometheus:
      prometheusSpec:
        # No object storage on this cluster yet. Removing the block also removes
        # the Thanos sidecar, which would crash-loop without credentials.
        # Returns in phase 6 with the S3 bucket and IRSA role (#35).
        thanos: null

        # base says 15d. 10Gi does not hold 15 days of this cluster's series and
        # Prometheus does not warn - it silently drops the oldest blocks. 7d is
        # honest about the storage. Raise it with the volume, not alone.
        retention: 7d

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # Memory only. A CPU limit throttles the scrape loop for no benefit;
            # memory is not compressible so it gets a real ceiling.
            memory: 1Gi

        # SAME SIZE AND SHAPE AS BEFORE THE TEARDOWN, deliberately. The
        # Prometheus Operator derives the PVC name from the StatefulSet, so with
        # release name `monitoring` and 10Gi this re-binds the existing volume
        # and the previous days of metrics come back. Change either and you get
        # a new empty volume while the old one bills quietly in the background.
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 10Gi

        # The monitoring Karpenter pool (#244). Without BOTH of these the pod
        # either lands on a general node or sits Pending against a taint - and
        # Pending reads as "broken" long before anyone checks the taint.
        nodeSelector:
          workload: monitoring
        tolerations:
          - key: dedicated
            value: monitoring
            effect: NoSchedule

    prometheusOperator:
      nodeSelector:
        workload: monitoring
      tolerations:
        - key: dedicated
          value: monitoring
          effect: NoSchedule

    # Hyphenated: this is the SUBCHART's name, not a camelCase chart value.
    # `kubeStateMetrics` is the on/off toggle; `kube-state-metrics` is where the
    # subchart's own values go. Placement under the wrong one is accepted
    # silently and does nothing.
    kube-state-metrics:
      nodeSelector:
        workload: monitoring
      tolerations:
        - key: dedicated
          value: monitoring
          effect: NoSchedule

    # NO prometheus-node-exporter BLOCK, DELIBERATELY.
    #
    # It is a DaemonSet that must cover every node, and the subchart already
    # defaults to `tolerations: [{operator: Exists, effect: NoSchedule}]` - a
    # blanket toleration matching every taint in the cluster. Helm OVERWRITES
    # lists rather than merging them, so naming any toleration here replaces
    # that blanket with only what is named: a narrow `dedicated=monitoring`
    # entry silently dropped the logging and istio pools, leaving two nodes
    # with no host metrics and nothing red anywhere to show it (3/5 DaemonSet
    # pods after the phase-2 install). The correct value is no value.

    # -----------------------------------------------------------------------
    # GRAFANA (#36 dashboards, #38 SSO) - phase 3
    # -----------------------------------------------------------------------
    # base's two dashboard ConfigMaps are picked up by the sidecar
    # (searchNamespace: ALL, set in base), so #36's dashboards arrive with the
    # pod and need nothing here.
    #
    # NOTE ON STATE: unlike Prometheus and Alertmanager, Grafana comes up on a
    # NEW empty volume. Its PVC is a plain Helm resource and was pruned with
    # the release at teardown, where theirs are created by the Prometheus
    # Operator from StatefulSet volumeClaimTemplates and Helm never owned
    # them. Provisioned dashboards return; anything made by hand in the UI
    # before the rebuild does not.
    grafana:
      enabled: true

      # base sets `envFromSecret: grafana-authentik-oauth`. That SealedSecret
      # is removed in kustomization.yaml because it was sealed with
      # 25c-shared's controller key and cannot decrypt here. The envFrom
      # reference MUST go with it - a Deployment referencing a Secret that
      # does not exist never starts its pods, and it fails as
      # CreateContainerConfigError, which says nothing about authentik.
      envFromSecret: null

      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

      nodeSelector:
        workload: monitoring
      tolerations:
        - key: dedicated
          value: monitoring
          effect: NoSchedule

      # One replica on a ReadWriteOnce EBS volume. The subchart default is
      # RollingUpdate (maxSurge 25% -> 1, maxUnavailable 25% -> 0), which
      # starts the NEW pod before stopping the old one. Across two nodes that
      # deadlocks: the new pod waits on a volume still attached to the old
      # node (Multi-Attach error), and the old pod is never terminated because
      # the new one never becomes Ready. Recreate stops the old pod first, so
      # this move - and every future spot interruption - completes on its own.
      # Prometheus and Alertmanager need nothing: StatefulSets already replace
      # a pod delete-then-create.
      deploymentStrategy:
        type: Recreate

      grafana.ini:
        server:
          # Grafana builds every absolute URL from this - dashboard share
          # links, alert notification links. base's value is 25c-shared's
          # hostname, which no longer resolves. This is the name Teleport
          # serves the app under (see teleport-agent/patch.yaml).
          root_url: https://grafana.teleport.25c-team1.art

        # Merge-patch null: deletes the authentik block base sets. authentik
        # ran on 25c-shared and is gone - no namespace here, no
        # auth.25c-team1.art record, and its client secret is unsealable. An
        # unreachable issuer renders a login button that errors at the
        # callback, which is worse than no button at all.
        auth.generic_oauth: null

        # Teleport forwards this header on every proxied request, signed with
        # the cluster's JWT signing key; Grafana validates it against the
        # public JWKS. No shared secret, nothing to seal, and the key rotates
        # with Teleport's own CA. This is #38.
        auth.jwt:
          enabled: true
          header_name: Teleport-Jwt-Assertion
          username_claim: sub
          email_claim: sub
          jwk_set_url: https://teleport.25c-team1.art/.well-known/jwks.json
          cache_ttl: 60m
          # Anyone who reaches Grafana has already passed Teleport's login and
          # second factor, so there is nobody to create an account for who was
          # not already authenticated.
          auto_sign_up: true

        auth:
          # Nothing should reach Grafana except through Teleport, so the local
          # login form is dead weight and an invitation to set a weak password.
          disable_login_form: true
          disable_signout_menu: true

        auth.anonymous:
          enabled: false

        users:
          # Everyone lands read-only. Promoting someone is a deliberate act in
          # Grafana, not a side effect of having a Teleport account. Mapping
          # Teleport roles to Grafana roles needs role_attribute_path over a
          # claim whose shape is not verified yet - see the PR description.
          auto_assign_org_role: Viewer

    # -----------------------------------------------------------------------
    # ALERTMANAGER - phase 4, also behind Teleport
    # -----------------------------------------------------------------------
    # THIS SHIPS THE CHART'S DEFAULT ROUTING, WHICH RESOLVES TO A NULL
    # RECEIVER. base's two PrometheusRule files have been loaded since phase 2,
    # so alerts fire, group and display in this UI - and are delivered NOWHERE.
    # A real receiver needs a Slack webhook (or SMTP credentials) sealed with
    # THIS cluster's controller key: that is phase 5 and the open half of
    # gitops-flux#37. Until it lands, this is observable alerting, not
    # delivered alerting - a green Alertmanager does not mean anyone is paged.
    alertmanager:
      enabled: true
      alertmanagerSpec:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 256Mi
        # 5Gi matches the PVC that survived the teardown (8d old, us-east-1a),
        # so this re-binds rather than provisioning a second volume.
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
        nodeSelector:
          workload: monitoring
        tolerations:
          - key: dedicated
            value: monitoring
            effect: NoSchedule

    # EKS runs these on the managed control plane and exposes nothing to scrape.
    # Left enabled they produce permanent TargetDown alerts for things that are
    # not broken - which is how an alerting stack teaches people to ignore it.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
