# gitops-flux/infrastructures/dev/dev-eks-us-east-1/kube-prometheus-stack
#
# Prometheus, Grafana and Alertmanager. Grafana and Alertmanager carry no
# ingress - both are registered as Teleport applications in the teleport-agent
# overlay and reached at <app>.teleport.25c-team1.art (ADR 0016).
#
# Two things are still removed from the shared base, both because they cannot
# work on this cluster rather than because they are unwanted:
#
# - Thanos (thanos-objstore-secret + prometheusSpec.thanos + the
#   prometheus-irsa valuesFrom). The 25c-shared bucket and IRSA role still
#   exist in the account but are NOT reusable: the role trusts an OIDC
#   provider that was deleted with that cluster, and its `sub` names the old
#   release's service account. Neither resource is managed by
#   terraform-infra-v2. Thanos here needs a new bucket and a new IRSA role,
#   which is a terraform change, not a gitops one.
#
# - The Grafana authentik SSO SealedSecret. authentik ran on 25c-shared: there
#   is no namespace here, no auth.25c-team1.art record, and a SealedSecret is
#   encrypted to one controller's key pair, so that ciphertext is
#   undecryptable on this cluster and the Secret would never materialise.
#   patch.yaml also nulls the `envFromSecret` that referenced it - removing
#   one without the other leaves Grafana in CreateContainerConfigError.
#
# RESTORED in this change, both previously removed for reasons that no longer
# hold:
#
# - The two PrometheusRules. They were removed because their CRD ships with
#   this HelmRelease, and on a cold cluster the `infrastructure` Kustomization
#   dry-runs the whole path before applying any of it, so one unknown kind
#   aborted the ENTIRE apply. The CRDs have been registered since #209 - the
#   chart's own rules are live - so the ordering hazard is gone.
#
# - The two Grafana dashboard ConfigMaps. Removed because there was no Grafana
#   to load them. There is now, and the base enables the dashboard sidecar
#   with searchNamespace: ALL, so they are picked up by label.
#
# No top-level `namespace:` - the HelmRelease stays in flux-system like every
# other overlay on this cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/kube-prometheus-stack
patches:
  - path: patch.yaml
    target:
      kind: HelmRelease
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: thanos-objstore-secret
        namespace: monitoring
  - patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: grafana-authentik-oauth
        namespace: monitoring

labels:
  - pairs:
      kustomize.toolkit.fluxcd.io/prune: enabled
