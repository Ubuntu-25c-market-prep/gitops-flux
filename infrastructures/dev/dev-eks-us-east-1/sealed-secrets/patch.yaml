apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  values:
    # Same sizing as 25c-shared's overlay - already small, no reason to
    # rediscover a number for a controller that's idle between decrypts.
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 100m
    podLabels:
      environment: dev
