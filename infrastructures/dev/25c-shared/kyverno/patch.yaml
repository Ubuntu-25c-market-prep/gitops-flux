apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  values:
    # Dev sizing for the four Kyverno controllers, on a tight 3-node
    # t3.medium cluster. admissionController stays HA (it's on the request
    # path for every API write); cleanupController isn't, so one replica
    # is enough. podAntiAffinity spreading replicas across nodes is this
    # chart's default already - nothing extra needed for that here.
    admissionController:
      replicas: 2
      container:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 384Mi
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      nodeSelector:
        u25c.io/pool: platform
      tolerations:
        - key: u25c.io/pool
          value: platform
          effect: NoSchedule
      priorityClassName: system-cluster-critical
      # On the request path for every API write - losing every replica at
      # once means every admission request in the cluster blocks or fails
      # open, Karpenter's own node/pod creation included if its webhook is
      # failurePolicy: Fail. The PDB above only blocks eviction of the LAST
      # replica; this keeps Karpenter from targeting the node at all.
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

    backgroundController:
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      nodeSelector:
        u25c.io/pool: platform
      tolerations:
        - key: u25c.io/pool
          value: platform
          effect: NoSchedule
      priorityClassName: system-cluster-critical
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

    reportsController:
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      nodeSelector:
        u25c.io/pool: platform
      tolerations:
        - key: u25c.io/pool
          value: platform
          effect: NoSchedule
      priorityClassName: system-cluster-critical
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      nodeSelector:
        u25c.io/pool: platform
      tolerations:
        - key: u25c.io/pool
          value: platform
          effect: NoSchedule
      priorityClassName: system-cluster-critical
      # No PDB (single replica, so minAvailable would just block its own
      # eviction outright) - do-not-disrupt is the only thing standing
      # between this controller and a consolidation-triggered eviction.
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

    podLabels:
      environment: dev
