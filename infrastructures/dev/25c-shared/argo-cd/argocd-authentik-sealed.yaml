# gitops-flux/infrastructures/dev/25c-shared/argo-cd/argocd-authentik-sealed.yaml
#
# The client secret for Argo CD's authentik OIDC connector.
#
# THE LABEL IS LOAD-BEARING. Argo CD only resolves `$name:key` references from
# Secrets carrying app.kubernetes.io/part-of: argocd - without it the reference
# in oidc.config stays an uninterpolated literal and the login fails claiming
# the client is unauthorised, which points nowhere near a missing label.
#
# Overlay rather than base/, matching the reservation the overlay kustomization
# has been carrying since #52: the credential belongs to THIS authentik, and a
# second cluster inheriting base/ must not receive it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-authentik-oauth
  namespace: argocd
spec:
  encryptedData:
    clientSecret: 
  template:
    metadata:
      name: argocd-authentik-oauth
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: argocd
