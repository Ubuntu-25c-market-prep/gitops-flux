apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: flux-system
spec:
  # The rancher chart exposes NO nodeSelector, tolerations or affinity values -
  # confirmed against 2.14.3's values.yaml, which has resources, antiAffinity
  # and topologyKey and nothing else for scheduling. Setting them under
  # `values:` would be accepted by Helm, silently ignored, and leave Git
  # claiming a placement that never happened - the same trap the external-dns
  # overlay documents for replicaCount.
  #
  # A postRenderer patches the chart's rendered output instead, which is the
  # Flux-native answer when a chart will not take a value.
  #
  # This matters because all three pools Rancher could sensibly use - platform,
  # burst and observability - are TAINTED (gitops-flux#107). A pod that cannot
  # declare a toleration cannot land on any of them, so without this Rancher
  # falls through to the untainted `apps` pool, which is reserved for business
  # workloads.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: rancher
            patch: |
              # `add` on /spec/template/spec/nodeSelector creates the key -
              # the chart renders no nodeSelector at all, so `replace` would
              # fail on a missing path.
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  u25c.io/pool: platform
                  # The pools admit arm64 and amd64. Rancher publishes
                  # multi-arch images, but several components it pulls in have
                  # historically been amd64-only, and a Spot pool is free to
                  # hand us either. Pinning removes a class of failure that
                  # only shows up after a node is replaced.
                  kubernetes.io/arch: amd64
              # `/-` APPENDS to the existing tolerations list. The chart already
              # renders a cattle.io/os=linux toleration; replacing the list
              # instead of appending would drop it.
              - op: add
                path: /spec/template/spec/tolerations/-
                value:
                  key: u25c.io/pool
                  operator: Equal
                  value: platform
                  effect: NoSchedule
              # Point Rancher's outbound TLS trust at the real root store.
              #
              # rancher/rancher:v2.14.3 sets SSL_CERT_DIR=/etc/rancher/ssl in
              # the IMAGE. With privateCA: false the chart mounts nothing there
              # and there is no initContainer to populate it, so the directory
              # does not exist:
              #
              #   $ kubectl -n cattle-system exec deploy/rancher -- \
              #       ls /etc/rancher/ssl/
              #   ls: cannot access '/etc/rancher/ssl/': No such file or directory
              #
              # SSL_CERT_DIR is honoured by OpenSSL and by Go's crypto/x509,
              # and it REPLACES the default search path rather than adding to
              # it. So Rancher's entire outbound trust store is empty and every
              # server-to-server HTTPS call fails to verify, while the browser
              # leg - which never touches this - works fine. That asymmetry is
              # why this reads as "SSO is broken" rather than as a TLS problem:
              #
              #   $ kubectl -n cattle-system exec deploy/rancher -- \
              #       curl -sS https://auth.25c-team1.art/application/o/token/
              #   curl: (60) SSL certificate problem: unable to get local
              #         issuer certificate
              #
              # /etc/ssl/certs in this image is complete and current - it
              # carries ISRG_Root_X1.pem and ISRG_Root_X2.pem, which is what
              # the gateway's Let's Encrypt chain needs (leaf -> YE2 ->
              # Root YE -> ISRG Root X2, cross-signed by ISRG Root X1). With
              # this override the same two calls return 405 and 401 - real
              # answers from authentik rather than a TLS failure.
              #
              # THIS SUPERSEDES privateCA. If anyone ever sets privateCA: true
              # to trust a private issuer, the bundle lands in /etc/rancher/ssl
              # and this line makes Rancher ignore it. Remove this override at
              # the same time, or the private CA will silently do nothing.
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: SSL_CERT_DIR
                  value: /etc/ssl/certs

  values:
    # The name published by external-dns from the istio ingressgateway Service
    # (#108). Rancher writes this into its own settings and every agent it ever
    # deploys calls back to it, so changing it later is not a values edit - it
    # is a re-registration of every downstream cluster.
    hostname: rancher.25c-team1.art

    # Chart default is 3. One is right for dev: the pool caps at 8 CPU / 32Gi,
    # and three Rancher replicas on a cluster with two t3.medium nodes and a
    # Spot-first pool buys availability nobody is asking for here.
    replicas: 1

    # The gateway now serves a cert-manager-issued Let's Encrypt production
    # certificate (gitops-flux#146), not the self-signed one Rancher was
    # originally set up to trust. privateCA: true would mount a CA bundle
    # containing only the OLD self-signed CA - a publicly trusted chain
    # does not validate against that bundle, so every Rancher agent breaks
    # at once if this stays true. false means Rancher validates the
    # gateway's certificate against the system trust store instead, which
    # already trusts Let's Encrypt.
    privateCA: false

    # Dev sizing. A CPU request but no CPU limit, matching cert-manager and
    # external-dns in this overlay: the request is what the scheduler reserves,
    # while a CPU limit would throttle Rancher's controllers for no benefit.
    # Memory is not compressible, so it gets a real ceiling.
    #
    # 1Gi/2Gi is well under SUSE's documented 4 vCPU / 16Gi "Small" tier, which
    # sizes for managing up to 150 clusters. This one manages itself and, later,
    # one home k3s cluster.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
