# gitops-flux/infrastructures/dev/25c-shared/rancher/virtualservice.yaml
#
# The routing half. gateway.yaml (istio-gateway overlay) already says "I accept
# *.25c-team1.art on 443 and here is the certificate"; nothing yet said where
# rancher.25c-team1.art should GO, which is why that hostname returns Istio's
# 404 today.
#
# This lives in the rancher overlay rather than the istio-gateway one on
# purpose: the Gateway is shared infrastructure owned by the istio workstream,
# but the route for one hostname belongs with the thing it routes to. Deleting
# this directory removes Rancher and its route together.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rancher
  namespace: cattle-system
spec:
  hosts:
    - rancher.25c-team1.art
  # <namespace>/<name> of the shared Gateway. A bare name would be resolved in
  # this VirtualService's own namespace (cattle-system), where no Gateway
  # exists, and the route would silently attach to nothing.
  gateways:
    - platform-istio/ingressgateway
  http:
    - route:
        - destination:
            # Rancher listens on plain HTTP here - TLS was terminated at the
            # gateway (spec.values.tls: external in the base HelmRelease), and
            # Envoy sets X-Forwarded-Proto so Rancher knows the original
            # request was HTTPS.
            host: rancher.cattle-system.svc.cluster.local
            port:
              number: 80
      # NO `timeout` field here, deliberately.
      #
      # Rancher's UI holds long websocket connections for live cluster state and
      # its agents hold long-lived tunnels, so this route must not impose a
      # request timeout. Istio's default already gives that: the API reference
      # states "Timeout for HTTP requests, default is disabled" - omitting the
      # field is how you get no timeout.
      #
      # Do NOT write `timeout: 0s` to express that. Istio's CRD validation
      # rejects it outright:
      #
      #   spec.http[0].timeout: Invalid value: "string": must be a valid
      #   duration greater than 1ms
      #
      # and because a resource that fails dry-run rejects the ENTIRE
      # Kustomization, that one line stops every workstream's changes - the
      # same failure shape as #110 and #93.
