# gitops-flux/infrastructures/dev/25c-shared/fluent-bit
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/fluent-bit
  # The fluent-bit user's Elasticsearch password, encrypted. Safe to commit:
  # only the in-cluster sealed-secrets controller holds the private key.
  # Read by the DaemonSet here AND by the elasticsearch-ilm CronJob, which
  # creates the user with it - one value, both sides.
  - sealed-secret.yaml
patches:
  - path: patch.yaml
    target:
      kind: HelmRelease
labels:
  - pairs:
      kustomize.toolkit.fluxcd.io/prune: enabled
