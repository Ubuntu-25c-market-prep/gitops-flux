# gitops-flux/infrastructures/dev/25c-shared/kibana/kibana.yaml
# The Kibana instance - an ECK custom resource, reconciled by the eck-operator
# in this namespace. Overlay-only, no base/: version and sizing are per-cluster
# decisions and dev upgrades first, the same reasoning elasticsearch/ uses.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: platform
  namespace: platform-logging
spec:
  # Must not be newer than the Elasticsearch it talks to - Kibana refuses to
  # start against an older Elasticsearch. Bump this only with elasticsearch.yaml.
  version: 9.5.2
  count: 1
  # The whole connection, in one line. ECK creates a dedicated internal user
  # for Kibana in Elasticsearch, mounts the CA so TLS verifies, and writes the
  # URL into Kibana's config. No credentials are configured here or committed.
  elasticsearchRef:
    name: platform
  podTemplate:
    spec:
      # platform pool, not observability: Kibana holds no volume. The
      # observability pool exists for workloads whose EBS disk must not be
      # moved; a stateless UI that can restart anywhere belongs on platform.
      # Fits the pool's 2 vCPU / 8 GiB ceiling with room.
      nodeSelector:
        u25c.io/pool: platform
      tolerations:
        - key: u25c.io/pool
          value: platform
          effect: NoSchedule
      priorityClassName: system-cluster-critical
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 500m
              # Request stays 1Gi: that is roughly what Kibana holds at rest
              # (measured 907Mi), and it fits the platform pool's existing
              # nodes, so this needs no new machine.
              memory: 1Gi
            limits:
              # Limit raised 1Gi -> 2Gi. 1Gi was ECK's documented *floor* -
              # enough to start, not enough to serve. Kibana sat at 907Mi of
              # a 1024Mi ceiling and was killed by the Node runtime the moment
              # a query allocated anything:
              #
              #   FATAL ERROR: Ineffective mark-compacts near heap limit
              #   Allocation failed - JavaScript heap out of memory
              #
              # Twelve restarts, exit code 134 (SIGABRT). Discover returned
              # "no results" because the backend died mid-search, while
              # Elasticsearch answered the identical query with 10,000 hits
              # and zero shard failures.
              #
              # ECK leaves NODE_OPTIONS empty, so Node sizes its heap from the
              # container's cgroup limit - raising the limit raises the heap,
              # which is the actual fix rather than just a higher ceiling.
              #
              # Consequence to know: request != limit makes this Burstable
              # rather than Guaranteed QoS, so under node memory pressure it
              # is evicted before a Guaranteed pod. Acceptable here - Kibana
              # is stateless, carries system-cluster-critical, and the
              # alternative (request 2Gi) does not fit any current platform
              # node and would buy a larger instance for a dev log viewer.
              memory: 2Gi
