apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  values:
    # Revisioned install from day one - gitops-flux#29 (upgrade rehearsal)
    # needs a second control plane to install alongside this one later, and
    # retrofitting a revision after the fact means reinstalling rather than
    # adding a revision.
    revision: "1-30-3"
    global:
      proxy:
        # Chart default requests (cpu: 100m, memory: 128Mi) are already fine
        # and left alone - only limits change. Default limits (cpu: 2000m,
        # memory: 1024Mi) are sized for hundreds of proxies across a large
        # mesh, not this cluster: gitops-argocd#11 hit it directly - one
        # storefront pod's sidecar alone (2000m/1024Mi) plus its own
        # container (200m/128Mi) exceeded app-dev's entire 2 CPU / 1Gi
        # ResourceQuota, and every namespace with a quota was going to
        # discover this the same way, with a stalled rollout naming a
        # number nobody chose in any manifest they wrote.
        #
        # 500m/256Mi mirrors what #11 already proved out per-pod via
        # sidecar.istio.io/proxyCPULimit annotations for a low-traffic
        # service, with headroom above that rather than matching it
        # exactly, since this is now every future workload's default
        # rather than one app's tuned override. Anything that genuinely
        # needs more still overrides per-pod the same way #11 did -
        # this only changes what an app gets with no annotation at all.
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
    pilot:
      # Chart default is sized for hundreds of proxies across a large mesh.
      # This cluster is 2x t3.medium; see the istio epic's capacity notes
      # (ops-program#21) for the full budget across every component landing
      # on it.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
    meshConfig:
      # Nodes span us-east-1a and us-east-1b - cross-AZ traffic is billed at
      # $0.02/GB round trip and compounds quietly, unlike a one-time cost.
      # This alone is enough: locality is read automatically from each
      # node's topology.kubernetes.io/zone label, and with no explicit
      # distribute/failover policy Istio's default is "prefer same zone,
      # spill to another zone only when the local one has no healthy
      # endpoint" - exactly the behavior that contains cost without
      # sacrificing availability if a zone empties out.
      localityLbSetting:
        enabled: true

    # ops-program/docs/node-placement.md: platform control-plane singletons
    # belong on the platform pool, not wherever the default scheduler finds
    # room (which can include the untainted apps pool meant for business
    # workloads). Same shape already used for kube-prometheus-stack.
    nodeSelector:
      u25c.io/pool: platform
    tolerations:
      - key: u25c.io/pool
        value: platform
        effect: NoSchedule
    # Istiod is on the admission path (every injected pod's sidecar
    # depends on it) - the doc calls this out by name after a real
    # incident where a priority-0 Kyverno pod got preempted by a
    # DaemonSet rollout.
    priorityClassName: system-cluster-critical
