apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali
  namespace: flux-system
spec:
  values:
    external_services:
      prometheus:
        # Platform Prometheus (monitoring epic, Wave 5), release name
        # "monitoring-kube-prometheus" per the chart's operator subchart
        # naming - confirmed against the live Service, not assumed.
        # Replaces the earlier personal-lab pointer (kadze/lab-tools,
        # lab-observability namespace), which was explicitly temporary
        # and has since been torn down.
        url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
      grafana:
        # internal_url only, deliberately no external_url - Grafana isn't
        # exposed outside the cluster (same "internal-only for now" call as
        # Kiali itself), so a clickable "open in Grafana" link would just
        # point at something the browser can't reach. This still fixes the
        # UI warning and lets Kiali's backend query Grafana's version.
        enabled: true
        internal_url: "http://monitoring-kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
    auth:
      # Not exposed outside the cluster - no VirtualService routes to this
      # yet, only reachable via `kubectl port-forward`. Revisit before ever
      # exposing it through the ingress gateway; anonymous + a public route
      # means anyone with the URL gets full read access to the mesh.
      strategy: "anonymous"
