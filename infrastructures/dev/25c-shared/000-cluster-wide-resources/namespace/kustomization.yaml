# gitops-flux/infrastructures/dev/25c-shared/000-cluster-wide-resources/namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Platform namespaces - one Namespace object each.
  - sealed-secrets.yaml
  - karpenter.yaml
  - cert-manager.yaml
  - external-dns.yaml
  - monitoring.yaml
  - keda.yaml
  # teleport.yaml and teleport-agent.yaml REMOVED: Teleport has moved to
  # dev-eks-us-east-1 as part of this cluster's decommissioning (#210).
  # Pruning deletes both namespaces - and the teleport PVC with them, which
  # is the standalone SQLite backend: users, MFA enrolments, the provision
  # token, the role and every session recording. Irreversible; the
  # StorageClass is reclaimPolicy: Delete, so the EBS volume goes too.
  # Snapshot it first if the audit log is wanted for the record.
  - kyverno.yaml
  - cattle-system.yaml
  - platform-logging.yaml
  - platform-scaling.yaml
  - platform-auth.yaml

  # Business application environments (gitops-flux#8). Each file carries its
  # Namespace, its ResourceQuota and its LimitRange, because they are one
  # decision. Argo CD deploys into these; Flux owns the namespaces themselves
  # (ADR 0015).
  - app-dev.yaml
  - app-stage.yaml
  - app-prod.yaml
