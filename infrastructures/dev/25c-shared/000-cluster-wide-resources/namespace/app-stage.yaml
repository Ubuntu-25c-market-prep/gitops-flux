# gitops-flux/infrastructures/dev/25c-shared/000-cluster-wide-resources/namespace/app-stage.yaml
#
# The stage environment for business applications.
#
# Sized identically to app-dev, and that is the point: stage exists to run the
# image that is about to be promoted to prod, under the same constraints it met
# in dev. A stage that is quietly roomier than dev tests nothing.
#
# See app-dev.yaml for the reasoning behind every value here.
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-stage
  labels:
    u25c.io/workstream: argocd
    u25c.io/owner: argocd
    u25c.io/environment: stage

    # Pod Security Admission, built into Kubernetes and free.
    #
    # `baseline` is enforced now because it blocks the things nobody legitimately
    # needs - privileged containers, host namespaces, hostPath. `restricted` is
    # only warned on, following platform-security's stated policy lifecycle:
    # audit, observe for a sprint, fix what it finds, then promote to enforce in
    # a separate pull request.
    #
    # This is not a substitute for Kyverno, which is not installed yet. It is the
    # part of the same posture that costs nothing to have today.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: app-stage
spec:
  hard:
    # `pods` is the binding constraint on this cluster, not CPU or memory.
    # t3.medium with vpc-cni allocates 17 pods per node, so two nodes give 34,
    # and 31 are already running. See the PR for the full arithmetic.
    pods: "4"

    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: app-stage
spec:
  limits:
    - type: Container

      # Defaults exist so that a container with no resources block still gets
      # one. Kyverno will reject workloads without requests and limits, and
      # LimitRange defaulting happens during admission mutation - before a
      # validating webhook sees the object - so this makes that rule survivable
      # rather than a wall.
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi

      # `max` is set to exactly Istio's default sidecar limits (2000m / 1Gi).
      #
      # This looks generous for a 2-vCPU node and it is deliberate. If these
      # namespaces are ever labelled for sidecar injection, every pod gains an
      # istio-proxy container carrying those defaults. A lower `max` would reject
      # every pod in the namespace at admission, and the error would point at the
      # injected sidecar rather than at this file.
      max:
        cpu: "2"
        memory: 1Gi
      min:
        cpu: 10m
        memory: 16Mi

      # No maxLimitRequestRatio on purpose. Istio's sidecar defaults are 100m
      # request against a 2000m limit - a ratio of 20 - so any sane ratio here
      # would reject injected pods.
