# gitops-flux/infrastructures/dev/25c-shared/000-cluster-wide-resources/namespace/platform-auth.yaml
#
# authentik's namespace - the identity provider every platform console will
# authenticate against (ADR 00NN).
#
# Flux owns this namespace and everything the authentik chart renders into it
# (ADR 0015). The HelmRelease sets `install.createNamespace: false` so this file
# is the single owner of the object, the same arrangement teleport uses.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-auth
  labels:
    u25c.io/workstream: zerotrust
    u25c.io/owner: zerotrust

    # No istio.io/rev, deliberately - matching the argocd namespace, and for the
    # same reason. authentik is a platform control plane, not a business
    # workload. A sidecar would sit in the path of every login in the cluster
    # and complicate authentik's egress to SMTP and, later, to AWS Identity
    # Center. Revisit only if mTLS to authentik becomes a stated requirement.

# No ResourceQuota, also deliberately. app-dev and platform-scaling carry one
# because they cap workloads that could otherwise grow without limit. The thing
# a quota does here is refuse to schedule the service that four consoles depend
# on for login, at the moment it most needs to restart. Kyverno already enforces
# per-container requests and limits, which is the control that matters.
