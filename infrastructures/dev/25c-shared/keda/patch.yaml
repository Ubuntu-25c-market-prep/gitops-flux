apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  values:
    # Dev sizing for the three KEDA components.
    resources:
      operator:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      metricServer:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      webhooks:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    podLabels:
      environment: dev
