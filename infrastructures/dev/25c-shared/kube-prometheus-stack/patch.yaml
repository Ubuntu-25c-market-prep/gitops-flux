apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  values:
    prometheus:
      prometheusSpec:
        retention: 7d
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 500m
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 10Gi
        thanos:
          objectStorageConfig:
            name: thanos-objstore-secret
            key: objstore.yml
    grafana:
      persistence:
        size: 2Gi
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 200m
      podLabels:
        environment: dev
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 128Mi
            cpu: 100m
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 2Gi
      config:
        route:
          receiver: default
          group_by: ['alertname', 'namespace', 'workstream']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - match:
                workstream: monitoring
              receiver: monitoring-team
            - match:
                workstream: istio
              receiver: istio-team
            - match:
                workstream: scaling
              receiver: scaling-team
            - match:
                workstream: security
              receiver: security-team
        receivers:
