# Istio's own Gateway CRD (from istio-base), not Kubernetes Gateway API -
# see the epic's own naming ("Gateway and VirtualService conventions") and
# the course's later exercises (fault injection, circuit breaking, mTLS,
# AuthorizationPolicy), none of which exist in Gateway API.
#
# No VirtualService yet - a Gateway with nothing attached is a legitimate,
# verifiable state: it accepts the TLS handshake and returns Istio's default
# 404 for any unmatched host. Real routing arrives with the Phase 3 demo
# app, which is what actually has something to route to.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: ingressgateway
  namespace: platform-istio
spec:
  selector:
    # The chart strips the "istio-" prefix from the release name for this
    # label - releaseName istio-ingressgateway produces istio: ingressgateway,
    # not istio: istio-ingressgateway. An earlier `helm template` check used
    # a placeholder release name ("test") that has no prefix to strip, which
    # hid this - confirmed against the actual deployed pod's live labels
    # (`kubectl get pod --show-labels`) and re-verified via `helm template`
    # with the real release name, not a stand-in.
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # cert-manager-issued (letsencrypt-prod), not the manually-sealed
        # self-signed cert this Gateway launched with - see certificate.yaml.
        credentialName: wildcard-25c-team1-art-tls
      # "localhost" is deliberately absent - Istio's admission webhook
      # rejects it outright ("short names (non FQDN) are not allowed"),
      # confirmed via `kubectl apply --dry-run=server`. Gateway hosts must
      # be FQDN-shaped (at least one dot). For local testing without real
      # DNS, use curl's --resolve or -H "Host: <name>.nip.io" against the
      # NLB's IP instead.
      hosts:
        - "*.25c-team1.art"
        - "*.nip.io"
